# This workflow owns exactly one question, and it is NOT the one test.yml owns: is the
# gate suite flaky on a shared runner under load? test.yml runs the suite once and can
# only ever answer "green here, now".
#
# WHY IT IS NOT ON EVERY PR. A meaningful sweep is tens of minutes — the suite is ~45s on
# a quiet developer box, so 25 runs under fork pressure is most of an hour of runner time
# to answer a question whose answer changes about once a release. Wiring that into every
# PR would buy a slow, expensive check that is mostly re-measuring a constant.
#
# HOW TO RUN IT
#   - Actions → flake sweep → Run workflow (choose `runs` and `load`), or
#   - add the `flake-sweep` label to a PR, which runs it against that PR's head.
# The label route exists so the evidence can be gathered BEFORE a change to the suite or
# the hooks merges, which is the case that actually matters.
#
# WHAT A CLEAN SWEEP MEANS, quoting the harness so the tick is not over-read: "a clean
# sweep lowers the odds of a flake at a given rate, it never excludes one. At an
# 8%-per-run rate, N clean runs still happen by chance with probability 0.92^N." Record
# the count and the load it ran under. A quiet box is the weak version of this
# experiment, which is why `load` defaults to non-zero here and not to 0.
#
# The needle is the exact TAP text of the S7 assertion, held as one string in
# test/s7-flake-loop.sh so a rename in gate-test.sh breaks the sweep loudly instead of
# silently matching nothing and reporting clean forever.
name: flake sweep

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "how many full gate-suite runs"
        required: false
        default: "25"
      load:
        description: "background fork-pressure workers (0 = quiet box, the weak experiment)"
        required: false
        default: "4"
  pull_request:
    types: [labeled]

permissions:
  contents: read

# One sweep at a time per ref. Two concurrent sweeps would contend for the same runner
# pool and each would measure the other's load rather than the load it was given.
concurrency:
  group: flake-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    # `types: [labeled]` fires for EVERY label, so the name is checked here rather than
    # in the trigger, which cannot express it.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'flake-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: toolchain and machine
        run: |
          printf 'bash    %s\n' "$(/usr/bin/env bash --version | head -1)"
          printf 'nproc   %s\n' "$(nproc)"
          printf 'load    %s\n' "$(cat /proc/loadavg)"

      # The label route has no inputs, so it takes the defaults. They are spelled out
      # here rather than left to `${{ inputs.x }}` evaluating empty on a label event,
      # which would have run the sweep with `runs=""` and failed obscurely.
      - name: sweep
        env:
          RUNS: ${{ github.event.inputs.runs || '25' }}
          LOAD: ${{ github.event.inputs.load || '4' }}
        run: |
          # The default runner shell is `bash -eo pipefail`, so a non-zero harness would
          # abort the step BEFORE the summary is printed — losing the evidence this
          # workflow exists to collect. The status is captured instead of inherited.
          logs="$(mktemp -d)"
          rc=0
          FORGEWARD_S7_LOGS="$logs" FORGEWARD_S7_LOAD="$LOAD" \
            bash test/s7-flake-loop.sh "$RUNS" || rc=$?

          echo "::group::sweep summary"
          [ -f "$logs/summary.txt" ] && cat "$logs/summary.txt"
          echo "::endgroup::"

          # The harness exits 0 whether or not it reproduced anything — it is an
          # instrument, not an assertion. Turning its tally into a verdict is this
          # workflow's job, and it must fail on OTHER failures too: a suite that went red
          # for an unrelated reason is not a clean sweep, and reading only the S7 tally
          # would report it as one.
          hits="$(sed -n 's/^done:.*s7_fail_open=\([0-9]*\).*/\1/p' "$logs/summary.txt" 2>/dev/null)"
          other="$(sed -n 's/^done:.*other_failures=\([0-9]*\)$/\1/p' "$logs/summary.txt" 2>/dev/null)"
          # An unparseable tally is a FAILURE, not a pass. The `done:` line is the only
          # thing that distinguishes "ran N times and found nothing" from "died on run 1",
          # and defaulting an absent tally to zero is how the second reports as the first.
          if [ -z "$hits" ] || [ -z "$other" ]; then
            echo "could not parse the sweep tally (harness rc=$rc) — failing rather than passing" >&2
            exit 1
          fi
          echo "s7_fail_open=$hits other_failures=$other harness_rc=$rc"
          if [ "$hits" != "0" ] || [ "$other" != "0" ] || [ "$rc" != "0" ]; then
            for f in "$logs"/HIT-*.log "$logs"/OTHERFAIL-*.log; do
              [ -e "$f" ] || continue
              echo "::group::$(basename "$f")"
              cat "$f"
              echo "::endgroup::"
            done
            exit 1
          fi
