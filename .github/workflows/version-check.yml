# The repo's first CI workflow. It owns exactly one question: would merging this PR
# move the plugin version BACKWARD? See ci/check-version-monotonic.sh for why that
# hazard exists, why it was previously dodged by hand, and why the gate cannot see it.
#
# Deliberately NOT in this workflow: the test suites. `npm test` runs gate-test.sh and
# pre-push-test.sh, and wiring them into CI is a separate decision with its own
# trade-offs (the suite is documented as load-sensitive, and a flaky required check is
# worse than no check). Recorded in TODOS.md rather than folded in here silently.
#
# PR-only on purpose. On a push to master the base ref IS the commit being checked, so
# the comparison is against itself and passes vacuously -- a green tick that means
# nothing. This has to run where two versions actually exist.
name: version check

on:
  pull_request:

permissions:
  contents: read

jobs:
  monotonic:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, not tag-pinned: a tag can be repointed, a SHA cannot. The SHA was
      # RESOLVED, not recalled -- `git ls-remote --tags https://github.com/actions/checkout v4`
      # on 2026-08-06, run twice independently, returning 11d5960 for refs/tags/v4 (a
      # lightweight tag, so it names the commit directly and there is no ^{} to deref).
      # An unverified SHA typed from memory would have been strictly worse than the tag.
      # A pin needs a refresh policy or it decays into a stale-action problem instead:
      # re-run that same ls-remote when GitHub cuts a new v4.x. Tracked in TODOS.md.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config for the rest of the job. The
          # workflow already holds only `contents: read` and references no secrets, so
          # this is depth rather than a live hole -- but the script that runs next is
          # checked out from the PR head, which on a fork PR is contributor-controlled
          # content, and there is no reason for it to have a credential in reach.
          persist-credentials: false
          # The PR HEAD, not GitHub's synthetic merge commit. What this check needs to
          # judge is the version the author wrote; the merge commit's version is a
          # merge RESULT, which conflates "the branch is fine" with "git happened to
          # resolve it in the forward direction this time".
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history so `origin/<base>` resolves. The script refuses to run rather
          # than pass when it does not.
          fetch-depth: 0

      - name: version is not behind the base branch
        # Through the environment, never interpolated into the shell line. `base_ref`
        # is a branch name in the target repo rather than anything a fork controls, so
        # this is hygiene rather than a live hole -- but the inline form is the one
        # that becomes a hole the moment someone copies it onto `head_ref`.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ci/check-version-monotonic.sh "origin/$BASE_REF"
